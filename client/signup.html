<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign Up</title>
<link rel="stylesheet" href="style.css" />
<script src="theme.js"></script>
</head>
<body>
<div class="app-shell" style="max-width:400px; padding-top:60px;">
  <h1 style="text-align:center;">🎙️ Interview Prep</h1>
  <p class="subtitle" style="text-align:center;">Create your account</p>
  <div class="card">
    <div id="errorArea"></div>
    <div class="field">
      <label for="email">Email</label>
      <input type="text" id="email" autocomplete="username" />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="new-password" />
      <p class="muted small" style="margin-top:6px;">At least 8 characters.</p>
    </div>
    <div class="field">
      <label for="confirmPassword">Confirm password</label>
      <input type="password" id="confirmPassword" autocomplete="new-password" />
    </div>
    <div class="actions">
      <button class="primary" id="signupBtn" style="flex:1;">Sign Up</button>
    </div>
  </div>
  <p class="muted small" style="text-align:center;">Already have an account? <a href="login.html">Log in</a></p>
</div>
<script src="shared.js"></script>
<script>
document.getElementById('signupBtn').addEventListener('click', submit);
document.getElementById('confirmPassword').addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });

async function submit() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const confirmPassword = document.getElementById('confirmPassword').value;
  const errorArea = document.getElementById('errorArea');
  const btn = document.getElementById('signupBtn');
  errorArea.innerHTML = '';

  if (password !== confirmPassword) {
    errorArea.innerHTML = `<div class="error-banner">Passwords don't match.</div>`;
    return;
  }

  btn.disabled = true; btn.textContent = 'Creating account...';
  try {
    const res = await fetch('/api/auth/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || 'Sign up failed');
    window.location.href = 'index.html';
  } catch (e) {
    errorArea.innerHTML = `<div class="error-banner">${escapeHtml(e.message)}</div>`;
    btn.disabled = false; btn.textContent = 'Sign Up';
  }
}
</script>
</body>
</html>
